name: Despliegue

# Cuando el CI de un push a main termina en verde (PLAN D19 y fase 4, tarea 3), publica en Cloudflare
# Pages el build que ese CI ha probado: su artefacto «torno-browser», con las rutas y el _headers ya
# preparados (scripts/pages.mjs). Va a la vista previa `staging` (https://staging.torno.pages.dev);
# la producción (--branch=main) llega en la fase 9, con una etiqueta v*. Después comprueba la vista
# previa como con curl (scripts/verify-pages.mjs) y lo deja en el resumen del job.
#
# Secrets (los pone Iván con `gh secret set NOMBRE`): CLOUDFLARE_API_TOKEN (solo «Cloudflare Pages:
# Edit») y CLOUDFLARE_ACCOUNT_ID. Sin ellos, termina con un aviso y no despliega.
# Un workflow_run solo se dispara con la versión de este archivo que hay en main.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  # Para descargar el artefacto del CI (otro workflow).
  actions: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Build del CI → vista previa de Cloudflare Pages
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Sin las métricas de uso de wrangler.
      WRANGLER_SEND_METRICS: 'false'
      COMMIT: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: ¿Están los secrets de Cloudflare?
        id: secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Cloudflare sin configurar::Faltan CLOUDFLARE_API_TOKEN o CLOUDFLARE_ACCOUNT_ID: no se despliega."
          fi

      # Acciones fijadas por SHA de commit (la versión va en el comentario).
      # El commit que probó el CI: de él salen la versión de wrangler (package.json, la misma que la
      # de los e2e) y la comprobación de la vista previa.
      - name: El commit probado
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: repo
          persist-credentials: false

      - name: El build que probó el CI
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: torno-browser
          path: site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # wrangler 4 pide Node 22 o más: el de .nvmrc, como en el CI.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version-file: repo/.nvmrc

      - name: Versión de wrangler y build preparado para Pages
        id: wrangler
        if: steps.secrets.outputs.ready == 'true'
        run: |
          version=$(jq -r '.devDependencies.wrangler' repo/package.json)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::wrangler tiene que ir fijado a una versión exacta en package.json (está «$version»)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # El build trae la 404 de Pages y su _headers con la CSP completa (scripts/pages.mjs).
          test -f site/404.html
          grep -q "script-src 'self' 'sha256-" site/_headers
          if grep -q "__SCRIPT_HASHES__" site/_headers; then
            echo "::error::El _headers del build no tiene la CSP completa"
            exit 1
          fi

      # La lista sale en silencio (quiet): el log es público y no hace falta enseñar los proyectos
      # de la cuenta.
      - name: Proyectos de Pages
        id: projects
        if: steps.secrets.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ steps.wrangler.outputs.version }}
          quiet: true
          command: pages project list --json

      - name: ¿Existe el proyecto torno?
        id: project
        if: steps.secrets.outputs.ready == 'true'
        env:
          PROJECTS: ${{ steps.projects.outputs.command-output }}
        run: |
          # Si la salida no es la lista de proyectos, jq falla y el job también.
          printf '%s' "$PROJECTS" | jq -e 'type == "array"' > /dev/null
          if printf '%s' "$PROJECTS" | jq -e 'any(.[]; .["Project Name"] == "torno")' > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Proyecto nuevo::El proyecto torno no existe en Pages: se crea (rama de producción main)."
          fi

      - name: Crea el proyecto torno (solo la primera vez)
        if: steps.project.outputs.exists == 'false'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ steps.wrangler.outputs.version }}
          command: pages project create torno --production-branch=main

      # El build del CI tal cual, sin builds de Cloudflare.
      - name: Despliega en la vista previa staging
        id: deploy
        if: steps.secrets.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ steps.wrangler.outputs.version }}
          command: pages deploy site --project-name=torno --branch=staging --commit-hash=${{ github.event.workflow_run.head_sha }}

      - name: Comprueba la vista previa
        if: steps.secrets.outputs.ready == 'true'
        env:
          ALIAS: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          URL: ${{ steps.deploy.outputs.deployment-url }}
          ENVIRONMENT: ${{ steps.deploy.outputs.pages-environment }}
        run: |
          {
            echo "### Cloudflare Pages ($ENVIRONMENT)"
            echo "- Vista previa: $ALIAS"
            echo "- Este despliegue: $URL"
            echo "- Commit: \`$COMMIT\`"
            echo ""
            echo "#### Comprobaciones (scripts/verify-pages.mjs)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # El alias puede tardar unos segundos en apuntar al despliegue nuevo: hasta 2 min.
          # pipefail: si falla la comprobación, falla el paso (sin él, mandaría el código de tee).
          set -o pipefail
          status=0
          node repo/scripts/verify-pages.mjs "${ALIAS:-$URL}" --build site --esperar 120 | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
