name: Despliegue a staging

# Cuando el CI de un push a main termina en verde (PLAN fase 4, tarea 3), sube por FTPS el build
# que ese CI ha probado (su artefacto «torno-browser», con el .htaccess y la CSP ya completa). Antes
# le añade al .htaccess el bloque del staging: `X-Robots-Tag: noindex` y la contraseña.
# Sin los secrets del staging, termina con un aviso y no despliega (fase 4.b).
#
# Secrets (los pone Iván con `gh secret set NOMBRE`):
# - STAGING_FTP_SERVER, STAGING_FTP_USERNAME, STAGING_FTP_PASSWORD: la cuenta FTP limitada a la
#   carpeta del subdominio (la raíz de esa cuenta es la del sitio).
# - STAGING_AUTH_USER_FILE (opcional, recomendado): la ruta del archivo de contraseñas que crea
#   cPanel al proteger la carpeta («Privacidad de directorios»), por ejemplo
#   /home/USUARIO/.htpasswds/staging-torno.ivanchesa.es/passwd. cPanel escribe la protección en el
#   .htaccess de la carpeta, que cada despliegue sustituye: por eso el despliegue la vuelve a poner.
#
# Un workflow_run solo se dispara con la versión de este archivo que hay en main.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  # Para descargar el artefacto del CI (otro workflow).
  actions: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Build del CI → staging (FTPS)
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: ¿Está configurado el staging?
        id: staging
        env:
          SERVER: ${{ secrets.STAGING_FTP_SERVER }}
          USERNAME: ${{ secrets.STAGING_FTP_USERNAME }}
          PASSWORD: ${{ secrets.STAGING_FTP_PASSWORD }}
        run: |
          if [ -n "$SERVER" ] && [ -n "$USERNAME" ] && [ -n "$PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Staging sin configurar::Faltan STAGING_FTP_SERVER, STAGING_FTP_USERNAME o STAGING_FTP_PASSWORD: no se despliega (fase 4.b)."
          fi

      # Acciones fijadas por SHA de commit (la versión va en el comentario).
      - name: El build que ha probado el CI
        if: steps.staging.outputs.ready == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: torno-browser
          path: site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Bloque del staging en el .htaccess (noindex y contraseña)
        if: steps.staging.outputs.ready == 'true'
        env:
          AUTH_USER_FILE: ${{ secrets.STAGING_AUTH_USER_FILE }}
        run: |
          # El build tiene que traer su .htaccess con la CSP completa (scripts/htaccess.mjs).
          grep -q "script-src 'self' 'sha256-" site/.htaccess
          if grep -q "__SCRIPT_HASHES__" site/.htaccess; then
            echo "::error::El .htaccess del build no tiene la CSP completa"
            exit 1
          fi
          {
            echo ""
            echo "# --- Solo en el staging (lo añade .github/workflows/deploy-staging.yml) ---"
            echo 'Header always set X-Robots-Tag "noindex, nofollow"'
            if [ -n "$AUTH_USER_FILE" ]; then
              echo 'AuthType Basic'
              echo 'AuthName "Torno (staging)"'
              echo "AuthUserFile \"$AUTH_USER_FILE\""
              echo 'Require valid-user'
            fi
          } >> site/.htaccess
          if [ -z "$AUTH_USER_FILE" ]; then
            echo "::warning title=Staging sin contraseña::Falta STAGING_AUTH_USER_FILE: el staging queda abierto (con noindex)."
          fi

      - name: Subida por FTPS
        if: steps.staging.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.STAGING_FTP_SERVER }}
          username: ${{ secrets.STAGING_FTP_USERNAME }}
          password: ${{ secrets.STAGING_FTP_PASSWORD }}
          protocol: ftps
          # Comprueba el certificado del servidor FTP (si Banahosting no lo permite, se ve en la 4.b).
          security: strict
          local-dir: ./site/
          server-dir: ./
