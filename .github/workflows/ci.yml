name: CI

# En los push a main y a las ramas de fase (el proyecto no usa pull requests para las fases), y en
# las pull requests (las de Dependabot).
on:
  push:
    branches: [main, 'fase-*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, tests, build, presupuestos y e2e
    # Imagen fijada: el audio de WebKit depende de los paquetes del sistema; se cambia a propósito.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Acciones fijadas por SHA de commit (la versión va en el comentario).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      # Los pasos pre* regeneran el worklet (scripts/build-worklet.mjs) antes de cada uno.
      - run: npm run lint
      - run: npm test
      # Banco del núcleo (PLAN §5): fuera de `check`; aquí, suelo de regresión de 50×.
      - run: npm run test:bench
        env:
          BENCH_MIN_FACTOR: '50'
      # El build incluye el paso que escribe los hashes de la CSP en el .htaccess (postbuild).
      - run: npm run build
      - run: node scripts/check-bundles.mjs

      # El build de main, tal como se ha probado, para el despliegue (deploy-staging.yml).
      # `include-hidden-files`: sin eso, el .htaccess no entraría en el artefacto.
      - name: Guardar el build para el despliegue
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: torno-browser
          path: dist/torno/browser/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      # Navegadores de Playwright en caché, con su versión en la clave (revisión del bloque B, #4):
      # sin caché, cada CI se jugaba una descarga que una vez se quedó colgada 20 min. Con la caché
      # acertada solo faltan los paquetes del sistema (apt). Diez minutos como mucho en cada caso.
      - name: Versión de Playwright
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Caché de los navegadores de Playwright
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-webkit

      - name: Navegadores y paquetes del sistema (sin caché)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium webkit

      - name: Paquetes del sistema de los navegadores (con caché)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 10
        run: npx playwright install-deps chromium webkit

      - run: npm run e2e

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
