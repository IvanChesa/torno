name: CI

# En los push a main, a las ramas de fase y a las de correcciones de bloque (el proyecto no usa pull
# requests para las fases), y en las pull requests (las de Dependabot).
#
# En paralelo (revisión del bloque C, #1: en un solo job, el CI de main tardaba 18 min, 14,6 de e2e):
# - «build»: el build (con los presupuestos) que prueban los e2e y que se despliega;
# - «comprobaciones»: lint, tests y banco del núcleo, a la vez que el build;
# - «e2e»: tres grupos a la vez, cada uno en su máquina, con el build de «build». Los del 3D van en
#   grupos aparte porque el WebGL de Chromium sin interfaz es por software y ocupa la máquina (ver
#   playwright.config.ts);
# - «e2e-informe»: si falla algún grupo, une sus informes en uno.
# El despliegue (deploy.yml) espera a que el workflow entero termine en verde.
on:
  push:
    branches: [main, 'fase-*', 'fix/*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build y presupuestos
    # Imagen fijada: el audio de WebKit depende de los paquetes del sistema; se cambia a propósito.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Acciones fijadas por SHA de commit (la versión va en el comentario).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      # El build incluye el paso que lo prepara para Cloudflare Pages: rutas como ruta.html, 404.html
      # y el _headers con los hashes de la CSP (postbuild, scripts/pages.mjs).
      - run: npm run build
      - run: node scripts/check-bundles.mjs

      # El build que prueban los e2e de abajo y que publica deploy.yml (solo si el CI entero termina
      # en verde y solo los push a main o a una rama de fase).
      - name: Guardar el build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: torno-browser
          path: dist/torno/browser/
          if-no-files-found: error
          retention-days: 7

  comprobaciones:
    name: Lint, tests y banco
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      # Los pasos pre* regeneran el worklet (scripts/build-worklet.mjs) antes de cada uno.
      - run: npm run lint
      - run: npm test
      # Banco del núcleo (PLAN §5): fuera de `check`; aquí, suelo de regresión de 50×.
      - run: npm run test:bench
        env:
          BENCH_MIN_FACTOR: '50'

  e2e:
    name: e2e (${{ matrix.grupo }})
    needs: build
    runs-on: ubuntu-24.04
    # Lo normal son 5–8 min; el margen es para los reintentos de la instalación de los navegadores.
    timeout-minutes: 25
    strategy:
      # Si falla un grupo, los demás siguen: el informe unido los enseña todos.
      fail-fast: false
      matrix:
        include:
          # El audio, los archivos, el instrumento HTML… en `ng serve` y en el build, y WebKit.
          - grupo: audio
            proyectos: --project=dev --project=estatico --project=webkit
            navegadores: chromium webkit
          # El escenario 3D, sin sus dependencias (`dependencies` en playwright.config.ts solo sirve
          # para que en local no vaya a la vez que los demás): aquí cada grupo tiene su máquina.
          - grupo: escena-dev
            proyectos: --project=escena-dev --no-deps
            navegadores: chromium
          - grupo: escena-estatico
            proyectos: --project=escena-estatico --no-deps
            navegadores: chromium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # El mismo build que se despliega, donde lo busca scripts/serve-pages.mjs.
      - name: El build de «build»
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: torno-browser
          path: dist/torno/browser

      # Navegadores de Playwright en caché, con su versión en la clave (revisión del bloque B, #4):
      # sin caché, cada CI se jugaba una descarga que una vez se quedó colgada 20 min. Con la caché
      # acertada solo faltan los paquetes del sistema (apt). Cada instalación, con intentos cortados.
      - name: Versión de Playwright
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # apt con tiempo límite, reintentos y sin pipelining HTTP: el espejo de Ubuntu de Azure se quedó
      # colgado a mitad de una descarga en los dos intentos del CI de la fusión de la fase 4 (27-10),
      # hasta el límite de 10 min. Así, una descarga parada se corta a los 20 s y se reintenta.
      - name: apt con tiempo límite y reintentos
        run: |
          # DPkg::Lock::Timeout: si un intento cortado aún tiene el bloqueo de dpkg, el siguiente espera.
          printf '%s\n' 'Acquire::Retries "5";' 'Acquire::http::Timeout "20";' \
            'Acquire::https::Timeout "20";' 'Acquire::http::Pipeline-Depth "0";' \
            'DPkg::Lock::Timeout "120";' \
            | sudo tee /etc/apt/apt.conf.d/99-torno-ci > /dev/null

      # La misma clave en los tres grupos (con los dos navegadores): el primero que la guarda sirve
      # a los demás.
      - name: Caché de los navegadores de Playwright
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-webkit

      # Cada instalación, en intentos con tiempo límite y hasta 3 (scripts/ci-playwright.sh): a veces
      # el espejo no se para del todo, sino que sigue a cuentagotas, y eso no lo corta el tiempo
      # límite de apt (así se colgó el CI de 79e3eed, el 27-10). Sin caché se descargan los dos
      # navegadores, para guardarla entera; con ella, solo los paquetes del sistema del grupo.
      - name: Navegadores y paquetes del sistema (sin caché)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 14
        run: bash scripts/ci-playwright.sh 240 install --with-deps chromium webkit

      - name: Paquetes del sistema de los navegadores (con caché)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 11
        env:
          NAVEGADORES: ${{ matrix.navegadores }}
        run: bash scripts/ci-playwright.sh 180 install-deps $NAVEGADORES

      # Los del build, contra `wrangler pages dev` (scripts/serve-pages.mjs), como en Pages.
      - name: e2e
        env:
          PROYECTOS: ${{ matrix.proyectos }}
          E2E_GRUPO: ${{ matrix.grupo }}
        run: npm run e2e -- $PROYECTOS

      # El informe de cada grupo, para unirlo en «e2e-informe» si algo falla.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.grupo }}
          path: blob-report/
          retention-days: 3

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: test-results-${{ matrix.grupo }}
          path: test-results/
          retention-days: 7

  e2e-informe:
    name: Informe unido de los e2e
    needs: e2e
    if: ${{ failure() && needs.e2e.result == 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --ignore-scripts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - run: npx playwright merge-reports --reporter html ./all-blob-reports

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
