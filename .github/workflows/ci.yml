name: CI

# En push solo a main: las ramas de fase pasan el CI a través de su pull request,
# así cada PR no lo ejecuta dos veces.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, tests, build, presupuestos y e2e
    # Imagen fijada: el audio de WebKit depende de los paquetes del sistema; se cambia a propósito.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Acciones fijadas por SHA de commit (la versión va en el comentario).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      # Los pasos pre* regeneran el worklet (scripts/build-worklet.mjs) antes de cada uno.
      - run: npm run lint
      - run: npm test
      # Banco del núcleo (PLAN §5): fuera de `check`; aquí, suelo de regresión de 50×.
      - run: npm run test:bench
        env:
          BENCH_MIN_FACTOR: '50'
      - run: npm run build
      - run: node scripts/check-bundles.mjs

      - run: npx playwright install --with-deps chromium webkit
      - run: npm run e2e

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
