name: Producción

# La producción (PLAN D19 y fase 9, tarea 1): publica en la rama de producción de Pages (`main`),
# es decir, en https://torno.pages.dev y en el dominio personalizado (torno.ivanchesa.com, cuando
# Iván lo añada en Pages), el build que **ya probó el CI** del push a main de ese mismo commit: su
# artefacto «torno-browser». Aquí no se construye nada.
#
# Se dispara:
# - con una etiqueta `v*` (`git tag -a v1.0.0 -m … && git push origin v1.0.0`), que tiene que
#   apuntar a un commit de main con el CI en verde y coincidir con la versión de package.json;
# - a mano (`gh workflow run production.yml -f etiqueta=v1.0.0 -f en_seco=false`), por ejemplo para
#   volver a publicar una etiqueta;
# - **en seco**, a mano y por defecto (`gh workflow run production.yml -f etiqueta=main`): hace todo
#   (busca el CI y su build, lo descarga, comprueba el _headers, prepara wrangler y pregunta a la API
#   por el proyecto) menos publicar y comprobar la producción. Sirve para probarlo sin etiqueta.
#
# Tras publicar, comprueba torno.pages.dev como con curl (scripts/verify-pages.mjs, que exige el
# `noindex` de *.pages.dev: la dirección canónica es la de site.config.ts) y, si ya resuelve, el
# dominio de site.config.ts. Los tests de este archivo están en scripts/workflows.spec.ts.
#
# Secrets: los de deploy.yml (CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID). Sin ellos, en seco
# avisa y en real falla.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      etiqueta:
        description: 'Qué publicar: una etiqueta vX.Y.Z (en seco, también main o el SHA de un commit de main)'
        required: true
        type: string
      en_seco:
        description: 'En seco: todo menos publicar y comprobar la producción'
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  # Para buscar el run del CI y descargar su artefacto.
  actions: read

# Una publicación en producción a la vez, sin cancelar la que está en marcha.
concurrency:
  group: produccion
  cancel-in-progress: false

jobs:
  production:
    name: Build del CI → producción de Cloudflare Pages
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Sin las métricas de uso de wrangler.
      WRANGLER_SEND_METRICS: 'false'
      # 'true' solo en un lanzamiento manual en seco; con una etiqueta, siempre 'false'.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.en_seco }}
    steps:
      # Acciones fijadas por SHA de commit (la versión va en el comentario).
      # Toda la historia, con las etiquetas: para resolver la etiqueta y saber si el commit está en main.
      - name: El repositorio, con la historia
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # Qué se publica. La etiqueta viene del push o del formulario: se valida antes de usarla y
      # nunca se escribe en un comando sin validar.
      - name: Qué se publica
        id: target
        env:
          EVENT: ${{ github.event_name }}
          PUSHED_TAG: ${{ github.ref_name }}
          INPUT_REF: ${{ inputs.etiqueta }}
        working-directory: repo
        run: |
          if [ "$EVENT" = push ]; then ref=$PUSHED_TAG; else ref=$INPUT_REF; fi
          if [[ "$ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            kind=tag
            sha=$(git rev-parse --verify --quiet "refs/tags/$ref^{commit}") || {
              echo "::error::La etiqueta «$ref» no existe en el repositorio"
              exit 1
            }
          elif [ "$DRY_RUN" = true ] && [[ "$ref" =~ ^(main|[0-9a-f]{7,40})$ ]]; then
            kind=prueba
            if [ "$ref" = main ]; then ref=origin/main; fi
            sha=$(git rev-parse --verify --quiet "$ref^{commit}") || {
              echo "::error::«$ref» no es un commit del repositorio"
              exit 1
            }
          else
            echo "::error::«$ref» no vale: tiene que ser una etiqueta vX.Y.Z (en seco, también main o el SHA de un commit)"
            exit 1
          fi
          # Solo lo que ya está en main: es lo que probó el CI de main y lo que sirve staging.
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::El commit $sha no está en main"
            exit 1
          fi
          git checkout --quiet --detach "$sha"
          # Con una etiqueta, la versión de package.json tiene que ser la misma (v1.0.0 ↔ 1.0.0).
          version=$(jq -r .version package.json)
          if [ "$kind" = tag ] && [ "v$version" != "$ref" ]; then
            echo "::error::La etiqueta $ref no coincide con la versión de package.json ($version)"
            exit 1
          fi
          {
            echo "ref=$ref"
            echo "kind=$kind"
            echo "sha=$sha"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      # El run del CI de un push a main con ese commit, en verde, y con su build todavía guardado
      # (ci.yml lo guarda 90 días en main). Si no lo hay, se dice qué hacer.
      - name: El CI en verde de ese commit y su build
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          run=$(gh run list --repo "$REPO" --workflow ci.yml --branch main --event push \
            --commit "$SHA" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$run" ]; then
            echo "::error::El commit $SHA no tiene un CI en verde de un push a main: se publica solo lo que ha probado el CI"
            exit 1
          fi
          artifact=$(gh api "repos/$REPO/actions/runs/$run/artifacts" \
            --jq '[.artifacts[] | select(.name == "torno-browser" and .expired == false)] | length')
          if [ "$artifact" != 1 ]; then
            # Relanzar aquel CI no vale: GitHub solo deja hacerlo 30 días, y volvería a publicar
            # staging con un build viejo. Lo bueno es un commit nuevo en main y etiquetarlo.
            echo "::error::El build del CI $run ya no está (caducado o borrado). Hace falta un commit nuevo en main (con el CI en verde) y poner la etiqueta en él"
            exit 1
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: ¿Están los secrets de Cloudflare?
        id: secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$DRY_RUN" = true ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Cloudflare sin configurar::Faltan CLOUDFLARE_API_TOKEN o CLOUDFLARE_ACCOUNT_ID: en real, esto fallaría."
          else
            echo "::error::Faltan CLOUDFLARE_API_TOKEN o CLOUDFLARE_ACCOUNT_ID: no se puede publicar"
            exit 1
          fi

      - name: El build que probó el CI
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: torno-browser
          path: site
          run-id: ${{ steps.ci.outputs.run }}
          github-token: ${{ github.token }}

      # wrangler 4 pide Node 22 o más: el de .nvmrc, como en el CI.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: repo/.nvmrc
          cache: npm
          cache-dependency-path: repo/package-lock.json

      - name: Versión de wrangler y build preparado para Pages
        id: wrangler
        run: |
          version=$(jq -r '.devDependencies.wrangler' repo/package.json)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::wrangler tiene que ir fijado a una versión exacta en package.json (está «$version»)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # El build trae la 404 de Pages y su _headers con la CSP completa (scripts/pages.mjs).
          test -f site/404.html
          grep -q "script-src 'self' 'sha256-" site/_headers
          if grep -q "__SCRIPT_HASHES__" site/_headers; then
            echo "::error::El _headers del build no tiene la CSP completa"
            exit 1
          fi

      # wrangler, con el árbol exacto del package-lock.json del commit (con sus integridades) y sin el
      # token en el entorno; sin scripts de instalación: pages deploy no necesita workerd.
      - name: wrangler del package-lock.json, sin el token
        working-directory: repo
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Solo una pregunta por torno (la respuesta no se imprime). En producción no se crea: lo creó
      # el primer despliegue de staging; si no está, algo va mal.
      - name: ¿Existe el proyecto torno?
        if: steps.secrets.outputs.ready == 'true'
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/pages/projects/torno")
          if [ "$status" != 200 ]; then
            echo "::error::La API de Cloudflare responde $status al preguntar por el proyecto torno"
            exit 1
          fi

      # El build del CI tal cual, a la rama de producción.
      - name: Publica en producción
        id: deploy
        if: env.DRY_RUN != 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ steps.wrangler.outputs.version }}
          workingDirectory: repo
          command: pages deploy ../site --project-name=torno --branch=main --commit-hash=${{ steps.target.outputs.sha }}

      - name: Resumen
        env:
          REF: ${{ steps.target.outputs.ref }}
          SHA: ${{ steps.target.outputs.sha }}
          VERSION: ${{ steps.target.outputs.version }}
          RUN: ${{ steps.ci.outputs.run }}
          WRANGLER: ${{ steps.wrangler.outputs.version }}
          URL: ${{ steps.deploy.outputs.deployment-url }}
          REPO: ${{ github.repository }}
        run: |
          {
            if [ "$DRY_RUN" = true ]; then
              echo "### Producción, en seco: no se ha publicado nada"
            else
              echo "### Producción de Cloudflare Pages"
              echo "- Este despliegue: $URL"
            fi
            echo "- Qué: \`$REF\` (versión $VERSION), commit \`$SHA\`"
            echo "- Build del CI: https://github.com/$REPO/actions/runs/$RUN"
            echo "- Archivos del build: $(find site -type f | wc -l)"
            echo "- Orden: \`wrangler@$WRANGLER pages deploy ../site --project-name=torno --branch=main --commit-hash=$SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Como deploy.yml: torno.pages.dev (con su noindex) y, si ya resuelve, el dominio canónico.
      - name: Comprueba la producción
        if: env.DRY_RUN != 'true'
        run: |
          {
            echo ""
            echo "#### Comprobaciones (scripts/verify-pages.mjs)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          set -o pipefail
          status=0
          node repo/scripts/verify-pages.mjs https://torno.pages.dev --build site --esperar 120 | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          # La dirección canónica sale de site.config.ts (la única fuente).
          base=$(grep -oE "baseUrl: 'https://[a-z0-9.-]+'" repo/src/app/core/site.config.ts | grep -oE "https://[a-z0-9.-]+") || base=''
          host=${base#https://}
          if [ -n "$host" ] && getent hosts "$host" > /dev/null; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            node repo/scripts/verify-pages.mjs "$base" --build site --esperar 120 | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          else
            echo "::warning title=Dominio sin conectar::${host:-el dominio de site.config.ts} todavía no resuelve: solo se ha comprobado torno.pages.dev."
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
