# Dependabot (PLAN fase 4, tarea 5): propone actualizaciones de las dependencias que ya hay (la
# lista cerrada de PLAN §1 no cambia) y de las acciones de GitHub, una vez por semana y agrupadas.
# Cada propuesta pasa el CI (sus pull requests lo disparan).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      # Un solo grupo para todo Angular, de producción y de desarrollo (revisión del bloque E, #1):
      # `@angular/compiler-cli` (desarrollo) exige la misma versión de `@angular/compiler`
      # (producción), así que subir solo una mitad rompe `npm ci` con `ERESOLVE`. Por eso el grupo no
      # filtra por `dependency-type` y el de desarrollo excluye lo de Angular de forma explícita.
      angular:
        patterns: ['@angular/*', '@angular-devkit/*', '@schematics/angular', 'angular-eslint']
        update-types: [minor, patch]
      desarrollo:
        dependency-type: development
        exclude-patterns: ['@angular/*', '@angular-devkit/*', '@schematics/angular', 'angular-eslint']
        update-types: [minor, patch]
    ignore:
      # Fijadas a mano por el plan:
      # - three 0.186 (D3); en 0.x, una versión «menor» rompe la API;
      - dependency-name: three
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: '@types/three'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      # - TypeScript, la que pide Angular, y esbuild, la que usa @angular/build;
      - dependency-name: typescript
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: esbuild
      # - los tipos de Node, los de la versión más antigua que admite el proyecto (`engines`: 22), no
      #   los de una versión mayor de Node que no se usa (la primera propuesta fue la 26);
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # - las versiones mayores de Angular, con su migración (`ng update`).
      - dependency-name: '@angular/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@angular-devkit/*'
        update-types: ['version-update:semver-major']
      - dependency-name: angular-eslint
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Madrid
    commit-message:
      prefix: chore
    groups:
      acciones:
        patterns: ['*']
